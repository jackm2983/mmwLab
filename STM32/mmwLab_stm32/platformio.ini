[env:nucleo_l496zg]
platform = ststm32
board = nucleo_l496zg
framework = stm32cube

build_flags =
    -DSTM32L4A6xx
    -DUSE_HAL_DRIVER
    -IInc
    -Iinclude

upload_protocol = stlink
debug_tool = stlink